pack_version: 1.0.0
pack_category: foundational

tier: A
required_tools:
  - product: wavecrux
    min_version: "1.0.0"
    max_version: "2.0.0"
optional_tools: []

learning_objectives:
  en:
    - "Identify each FSM state from the 2-bit state signal."
    - "Apply a GTKWave-compatible translate filter so state values render as named labels."
    - "Use the FSM Visualizer panel to see state transitions graphically."
    - "Place named markers and measure the FSM period from the marker delta."
