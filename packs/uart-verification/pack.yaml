schema_version: 1
pack_id: uart-verification
pack_version: 1.0.0
pack_category: integration
tier: B
required_tools:
  - product: simcrux
    min_version: "0.1.0"
    max_version: "1.0.0"
  - product: wavecrux
    min_version: "0.1.0"
    max_version: "1.0.0"
optional_tools: []
learning_objectives:
  en:
    - "Run a small regression and see a test fail on the dashboard."
    - "Cross-probe from a failing test straight to the waveform of that transmission."
    - "Read a UART serial line bit by bit and decode the byte actually sent."
    - "Determine whether a red test is a design bug or a wrong test expectation."
    - "Fix the right thing — here, the testbench, not the DUT."
prerequisites:
  - regression-hello-world
  - counter-lab
curriculum_topics:
  - verification_methodology
  - waveform_debug
  - serial_protocols
estimated_duration_minutes: 90
difficulty: intermediate
primary_hdl: verilog
alternates: []
content:
  src_dir: src/
  testbench_dir: tb/
  fixtures:
    waveform_vcd: fixtures/reference.vcd
    results:
      simcrux: fixtures/results.json
    sessions:
      wavecrux: fixtures/reference.wavecrux
    expected: fixtures/expected.json
  student_handouts:
    en: student/handout.md
  instructor:
    notes: instructor/notes.md
verified_against: []
locales:
  - en
maintainers:
  - Ferrite Engineering
short_description: >
  A SimCrux + WaveCrux pair: a UART regression where one test fails — but the
  waveform shows the DUT sent the byte correctly, so the bug is in the test's
  expectation, not the design. The failing-test-to-waveform loop, end to end.
