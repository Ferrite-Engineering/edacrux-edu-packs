schema_version: 1
pack_id: cdc-soc-capstone
pack_version: 1.0.0
pack_category: capstone
tier: C
required_tools:
  - product: netcrux
    min_version: "0.1.0"
    max_version: "1.0.0"
  - product: wavecrux
    min_version: "0.1.0"
    max_version: "1.0.0"
  - product: simcrux
    min_version: "0.1.0"
    max_version: "1.0.0"
  - product: lintcrux
    min_version: "0.1.0"
    max_version: "1.0.0"
optional_tools: []
learning_objectives:
  en:
    - "Identify the clock domains in a multi-clock SoC from its structure."
    - "Distinguish a correctly synchronized crossing (two-flop) from an unsynchronized one."
    - "Reason about metastability and multi-bit CDC hazards from the waveform."
    - "Recognise that a design can pass simulation and lint yet still contain a real CDC bug."
    - "Write a CDC analysis: which crossings are safe, which are not, and how to fix them."
prerequisites:
  - module-tour
  - regression-hello-world
  - lint-triage-101
  - counter-lab
curriculum_topics:
  - clock_domain_crossing
  - cross_tool_debug
  - verification_methodology
estimated_duration_minutes: 1200
difficulty: advanced
primary_hdl: verilog
alternates: []
content:
  src_dir: src/
  testbench_dir: tb/
  fixtures:
    waveform_vcd: fixtures/reference.vcd
    netlist:
      netcrux: fixtures/netlist.json
    lint:
      lintcrux: fixtures/lint.json
    results:
      simcrux: fixtures/results.json
    sessions:
      wavecrux: fixtures/reference.wavecrux
    expected: fixtures/expected.json
  student_handouts:
    en: student/handout.md
  instructor:
    notes: instructor/notes.md
verified_against: []
locales:
  - en
maintainers:
  - Ferrite Engineering
short_description: >
  A four-tool CDC capstone: a two-clock SoC with one safely-synchronized crossing
  and one unsynchronized multi-bit hazard. It passes simulation and lint — so the
  CDC bug must be found by analysing the structure and waveform by hand.
