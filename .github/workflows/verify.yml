name: Verify packs

# Runs on every push and PR. The point is that a pack's handout, its contract
# and its waveform cannot drift apart silently: the checkpoints in
# fixtures/expected.json are replayed against the pack's own reference.vcd, so
# a claim like "at 2575 ns the counter reads 0xFF" is checked rather than
# trusted. No GUI and no WaveCrux install is needed for that, which is why it
# can run on every commit.
#
# It does NOT establish that a pack works against a given WaveCrux release —
# that needs the app driven over WCP. Until that layer exists, nothing here
# should be reported as release-verified and `verified_against` stays empty.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Contract, structure and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify every pack
        run: ./tools/edacrux-pack-verify

      - name: Emit JUnit for the run summary
        if: always()
        run: ./tools/edacrux-pack-verify --output junit > pack-verify.xml || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pack-verify-results
          path: pack-verify.xml

  rebuild:
    name: Fixtures regenerate from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The committed VCDs are what students actually open, so they must remain
      # reproducible from the RTL beside them. Rebuilding catches RTL that
      # changed without its waveform being regenerated — which is exactly how a
      # handout starts describing something the waveform no longer does.
      # The toolchains the packs' build.sh scripts invoke. iverilog builds the
      # WaveCrux waveform fixtures; yosys synthesises the NetCrux netlists.
      # verilator is here for the LintCrux packs as they land.
      - name: Install simulation and synthesis tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys verilator

      - name: Rebuild every pack's fixtures from its RTL
        run: |
          set -euo pipefail
          for pack in packs/*/; do
            [ -x "$pack/build.sh" ] || continue
            echo "── $(basename "$pack")"
            ( cd "$pack" && ./build.sh >/dev/null )
          done

      # The gate is the CONTRACT against a freshly built waveform, not a
      # byte-diff against the committed one. Byte-identity is the wrong
      # property: VCD signal-id assignment and declaration order vary between
      # Icarus versions, so a diff gate fails whenever the runner's simulator
      # differs from the author's — which says nothing about whether the pack is
      # correct. What must hold is that the checkpoints still describe the
      # waveform the RTL actually produces, on whatever simulator built it.
      - name: Contract still holds against the rebuilt fixtures
        run: ./tools/edacrux-pack-verify

      # Sessions are derived from the fixtures, so they are checked after the
      # rebuild too: a signal that disappeared from the RTL would leave a
      # session row that silently vanishes on load.
      - name: Sessions still resolve against the rebuilt fixtures
        run: python3 tools/generate-sessions.py --check

      - name: Show what the rebuild changed, if anything
        if: always()
        run: |
          if ! git diff --quiet -- 'packs/*/fixtures/*'; then
            echo "::notice::rebuilt fixtures differ from the committed bytes"
            echo "This is expected when the runner's Icarus differs from the author's."
            git diff --stat -- 'packs/*/fixtures/*'
          else
            echo "Rebuilt fixtures are byte-identical to the committed ones."
          fi
