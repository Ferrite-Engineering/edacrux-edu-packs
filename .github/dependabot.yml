# Keeps the SHA-pinned GitHub Actions in .github/workflows current. Dependabot
# understands full-SHA pins and rewrites the trailing `# vX.Y.Z` comment.
#
# Merge policy: updates arrive as one grouped PR a week, and
# dependabot-merge.yml merges it once every check on it has passed; a PR with
# a failed check stays open for a person. The bot only edits `uses:` lines,
# so `timeout-minutes` and `permissions:` are untouched.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let a release settle before it is proposed.
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    ignore:
      # Pinned to a commit on its `stable` branch, not to a release tag. The
      # default branch's action requires a `toolchain` input, so moving the
      # pin there would break every Rust build. Refresh it by hand.
      - dependency-name: dtolnay/rust-toolchain
